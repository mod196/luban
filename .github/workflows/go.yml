name: Go

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOPROXY: https://goproxy.cn,direct

      - name: Run tests
        run: go test ./...
        env:
          GOPROXY: https://goproxy.cn,direct
