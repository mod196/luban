name: Build Luban Images

on:
  push:
    branches:
      - feature/k8s-service-tree-rbac
      - feature/runtime-platform-title-menu-cleanup
    paths:
      - ".github/workflows/build-luban-images.yml"
      - ".dockerignore"
      - "Dockerfile.backend"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "etc/**"
      - "luban_fe/**"
  workflow_dispatch:

env:
  ACR_REGISTRY: registry.cn-beijing.aliyuncs.com
  ACR_NAMESPACE: udhpnss

jobs:
  build:
    name: Build and push Luban source images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: luban
            context: .
            dockerfile: Dockerfile.backend
          - image: luban-fe
            context: luban_fe
            dockerfile: luban_fe/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
